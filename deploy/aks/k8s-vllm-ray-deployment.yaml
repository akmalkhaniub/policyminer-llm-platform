apiVersion: apps/v1
kind: Deployment
metadata:
  name: policyminer-vllm-ray-inference
  namespace: insurance-ai
  labels:
    app: policyminer-vllm-ray
spec:
  replicas: 2
  selector:
    matchLabels:
      app: policyminer-vllm-ray
  template:
    metadata:
      labels:
        app: policyminer-vllm-ray
    spec:
      containers:
        - name: vllm-lora-server
          image: lineslipacr.azurecr.io/policyminer-vllm-ray:v1.0.0
          args:
            - "--model=Qwen/Qwen2.5-14B-Instruct"
            - "--enable-lora"
            - "--lora-modules=insurance-pc-adapter=/mnt/azureblob/adapters/qwen25-14b-r16"
            - "--max-model-len=32768"
            - "--gpu-memory-utilization=0.90"
          ports:
            - containerPort: 8000
          resources:
            limits:
              nvidia.com/gpu: "1"
              memory: "48Gi"
              cpu: "8"
            requests:
              nvidia.com/gpu: "1"
              memory: "32Gi"
              cpu: "4"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: policyminer-vllm-gpu-hpa
  namespace: insurance-ai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: policyminer-vllm-ray-inference
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
