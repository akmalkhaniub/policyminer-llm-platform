version: "3.9"

services:
  policyminer-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: policyminer-llm-api
    ports:
      - "8020:8020"
    environment:
      - PYTHONUNBUFFERED=1
      - MLFLOW_TRACKING_URI=http://mlflow-server:5000
      - AZURE_STORAGE_ACCOUNT=lineslipmlstore
      - LANGCHAIN_TRACING_V2=true
      - LANGCHAIN_PROJECT=policyminer-commercial-insurance
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8020/healthz')"]
      interval: 20s
      timeout: 5s
      retries: 3

  mlflow-server:
    image: ghcr.io/mlflow/mlflow:v2.17.0
    container_name: policyminer-mlflow
    ports:
      - "5000:5000"
    command: mlflow server --host 0.0.0.0 --port 5000
