[project]
name = "policyminer-llm-platform"
version = "1.0.0"
description = "Enterprise Commercial Insurance Mining Platform: Unsloth QLoRA Fine-Tuning, Long-Context (128k) & Hybrid RAG (FAISS, Azure Cognitive Search, Pinecone, Weaviate), LangChain/LangSmith Agentic Pipeline, and Azure ML / AKS Deployment"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.9.0",
    "numpy>=1.26.0",
    "httpx>=0.27.0",
    "pytest>=8.3.0",
    "python-multipart>=0.0.9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
